<div style="display: flex; flex-direction: column; height: 100%;">
    <div style="margin: 10px">
        <mat-card style="background: #ffffff;">
            <div style="display: flex; justify-content: space-between; margin: 8px">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <mat-icon>stadium</mat-icon>
                    <span>Gestión de torneos</span>
                </div>
            </div>
            @if (dataLoaded === 1) {
                <div style="margin: 8px; overflow: auto;">
                    <table mat-table [dataSource]="tournaments">
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef style="font-weight: 600; background: #f5f5f5"> Nombre </th>
                            <td mat-cell *matCellDef="let t">
                                {{ t.name }}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="branch">
                            <th mat-header-cell *matHeaderCellDef style="font-weight: 600; background: #f5f5f5"> Sucursal </th>
                            <td mat-cell *matCellDef="let t">
                                {{ t.branch.company.name }} - {{ t.branch.name}}
                            </td>
                        </ng-container>
                        <ng-container matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef style="font-weight: 600; background: #f5f5f5; text-align: right"> Acciones </th>
                            <td mat-cell *matCellDef="let t">
                                <div style="display: flex; justify-content: end;">
                                    <button mat-icon-button [routerLink]="['../tournament-detail', t.id]">
                                        <mat-icon>info</mat-icon>
                                    </button>
                                </div>
                            </td>
                        </ng-container>
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                    </table>
                </div>
            } @else if (dataLoaded === 0) {
                <div style="display: flex; justify-content: center; margin: 20px 0">
                    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
                </div>
            } @else {
                <div style="display: flex; flex-direction: column; align-items: center; margin: 20px 0">
                    <mat-icon>search_off</mat-icon>
                    <span>No se encontraron torneos.</span>
                </div>
            }
        </mat-card>
    </div>
</div>
